name: Public catalog validation

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the public metadata boundary
        run: |
          jq -e '
            keys == ["catalogVersion", "plugins", "schema"]
            and (.plugins | type == "array" and length > 0)
            and all(.plugins[];
              keys == ["category", "displayName", "distribution", "id", "platforms", "runtimeInstall", "version"]
              and .distribution == "composition-time"
              and .runtimeInstall == "not-supported"
            )
            and ([.plugins[].id] | length == (unique | length))
          ' plugins.json
